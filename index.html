<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, orientation=landscape">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pi Camera Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        
        img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }
        #sensor-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
            max-height: 90vh;
            overflow-y: auto;
            transition: max-height 0.3s ease;
        }
        
        #sensor-panel.collapsed {
            max-height: 0;
            opacity: 0;
            border: none;
            overflow: hidden;
        }
        
        #sensor-panel.size-small {
            padding: 8px 12px;
            min-width: 100px;
            font-size: 10px;
        }
        
        #sensor-panel.size-medium {
            padding: 12px 16px;
            min-width: 140px;
            font-size: 13px;
        }
        
        #sensor-panel.size-large {
            padding: 16px 20px;
            min-width: 180px;
            font-size: 16px;
        }
        
        #size-buttons {
            display: flex;
            gap: 4px;
            flex: 1;
        }
        
        .size-btn {
            background: rgba(59, 130, 246, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }
        
        .size-btn:hover {
            background: rgba(59, 130, 246, 0.5);
        }
        
        .size-btn.active {
            background: rgba(59, 130, 246, 0.9);
            border-color: rgba(59, 130, 246, 0.9);
        }
        
        .sensor-item {
            margin-bottom: 8px;
        }
        
        .sensor-item:last-child {
            margin-bottom: 0;
        }
        
        .sensor-label {
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        #sensor-panel.size-small .sensor-label {
            font-size: 8px;
        }
        
        #sensor-panel.size-medium .sensor-label {
            font-size: 11px;
        }
        
        #sensor-panel.size-large .sensor-label {
            font-size: 13px;
        }
        
        .sensor-value {
            font-weight: bold;
            color: #4ade80;
            margin-top: 2px;
        }
        
        #sensor-panel.size-small .sensor-value {
            font-size: 13px;
        }
        
        #sensor-panel.size-medium .sensor-value {
            font-size: 16px;
        }
        
        #sensor-panel.size-large .sensor-value {
            font-size: 20px;
        }
        
        .sensor-error {
            color: #f87171;
        }
        
        #panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #sensor-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: white;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 102;
            font-size: 18px;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }
        
        #sensor-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(59, 130, 246, 0.9);
        }
        
        #joystick-container {
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 100;
            user-select: none;
            transition: all 0.3s ease;
        }
        
        #directional-pad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.4);
            touch-action: none;
        }
        
        #joystick-container.size-small #directional-pad {
            grid-template-columns: repeat(3, 30px);
            gap: 2px;
            padding: 4px;
        }
        
        #joystick-container.size-medium #directional-pad {
            grid-template-columns: repeat(3, 45px);
            gap: 4px;
            padding: 8px;
        }
        
        #joystick-container.size-large #directional-pad {
            grid-template-columns: repeat(3, 60px);
            gap: 6px;
            padding: 12px;
        }
        
        .dir-btn {
            border-radius: 6px;
            background: rgba(59, 130, 246, 0.3);
            border: 2px solid rgba(59, 130, 246, 0.5);
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: all 0.1s ease;
            touch-action: none;
            user-select: none;
        }
        
        #joystick-container.size-small .dir-btn {
            font-size: 12px;
            padding: 4px;
        }
        
        #joystick-container.size-medium .dir-btn {
            font-size: 14px;
            padding: 6px;
        }
        
        #joystick-container.size-large .dir-btn {
            font-size: 16px;
            padding: 8px;
        }
        
        .dir-btn:hover {
            background: rgba(59, 130, 246, 0.5);
            border-color: rgba(59, 130, 246, 0.8);
        }
        
        .dir-btn.active {
            background: rgba(59, 130, 246, 0.9);
            border-color: rgba(59, 130, 246, 1);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
        }
        
        .dir-btn-spacer {
            pointer-events: none;
        }
        
        #dir-forward {
            grid-column: 2;
            grid-row: 1;
        }
        
        #dir-left {
            grid-column: 1;
            grid-row: 2;
        }
        
        #dir-right {
            grid-column: 3;
            grid-row: 2;
        }
        
        #dir-back {
            grid-column: 2;
            grid-row: 3;
        }
        
        #dir-forward-left {
            grid-column: 1;
            grid-row: 1;
        }
        
        #dir-forward-right {
            grid-column: 3;
            grid-row: 1;
        }
        
        #dir-back-left {
            grid-column: 1;
            grid-row: 3;
        }
        
        #dir-back-right {
            grid-column: 3;
            grid-row: 3;
        }
        
        #dir-center {
            display: none;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <img src="/stream.mjpg" alt="Camera Stream">
    </div>
    
    <button id="sensor-toggle">☰</button>
    
    <div id="sensor-panel" class="size-medium">
        <div id="panel-header">
            <div id="size-buttons">
                <button class="size-btn" data-size="small">S</button>
                <button class="size-btn active" data-size="medium">M</button>
                <button class="size-btn" data-size="large">L</button>
            </div>
        </div>
        <div id="sensor-status">
            <div class="sensor-item">
                <div class="sensor-label">Temperature</div>
                <div class="sensor-value">--</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-label">Humidity</div>
                <div class="sensor-value">--</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-label">Pressure</div>
                <div class="sensor-value">--</div>
            </div>
        </div>
    </div>
    
    <div id="joystick-container">
        <div id="directional-pad">
            <button class="dir-btn" id="dir-forward-left">↖</button>
            <button class="dir-btn" id="dir-forward">↑</button>
            <button class="dir-btn" id="dir-forward-right">↗</button>
            
            <button class="dir-btn" id="dir-left">←</button>
            <button class="dir-btn dir-btn-spacer" id="dir-center">●</button>
            <button class="dir-btn" id="dir-right">→</button>
            
            <button class="dir-btn" id="dir-back-left">↙</button>
            <button class="dir-btn" id="dir-back">↓</button>
            <button class="dir-btn" id="dir-back-right">↘</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
